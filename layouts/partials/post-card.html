<article class="post-card"><div class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>{{ range first 2 .Params.categories }}<span>{{ . }}</span>{{ end }}</div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Summary | plainify | truncate 160 }}</p><a class="read-more" href="{{ .RelPermalink }}">继续阅读 <span aria-hidden="true">↗</span></a></article>
