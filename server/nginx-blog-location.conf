# Place these directives inside the existing HTTPS server block.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/xml;
location /cms-oauth/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # OAuth codes and state must not enter access logs.
    access_log off;
}
location / {
    root /data/oneyearago/blog-v2/current;
    index index.html;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}
error_page 404 /404.html;
location = /404.html {
    root /data/oneyearago/blog-v2/current;
    internal;
}
